[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtcli_gitrelease"
version = "0.0.7"
description = "Internal source send and Git release CLI for Quantatier projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.12.0",
]

[project.scripts]
qtcli_gitrelease = "qtcli_gitrelease.cli:app"

[tool.setuptools.packages.find]
include = ["qtcli_gitrelease*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
